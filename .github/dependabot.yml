# pip and Actions updates are automatic. Cargo's pinned Prime path dependencies
# live in the ignored prime-agent/ checkout, so Cargo Dependabot cannot fetch
# their manifests. rust-parity.yml builds and license-checks both actual graphs;
# Cargo update automation is an explicit open REPO-04 audit gate.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # tweepy 4.17 requires oauthlib<4 (see SECURITY.md). A 4.x bump makes
      # requirements-lock.txt uninstallable. Drop this when tweepy accepts oauthlib>=4.
      - dependency-name: oauthlib
        update-types: ["version-update:semver-major"]
      # tokenizers 0.23 requires huggingface-hub<2. A 2.x bump makes
      # requirements-lock.txt uninstallable. Drop this when tokenizers accepts it.
      - dependency-name: huggingface-hub
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
