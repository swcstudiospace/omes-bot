name: Bug report
description: Something in Omega Prime behaves wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: The smallest behavior that is wrong.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Commands, prompt, or script — with exit codes.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Tag or short SHA you ran.
    validations:
      required: true
  - type: checkboxes
    id: secrets
    attributes:
      label: Secrets check
      options:
        - label: This report contains no secrets, tokens, or private URLs
          required: true
