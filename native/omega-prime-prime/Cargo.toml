[package]
name = "omega_prime_prime"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[lib]
name = "omega_prime_prime"
crate-type = ["cdylib"]

# prime-agent patches crossterm with vendor/crossterm. That patch applies only
# inside the prime-agent workspace, so this crate repeats it. pa-tui calls
# symbols that exist only in the vendored parser.
[patch.crates-io]
crossterm = { path = "../../prime-agent/vendor/crossterm" }

[dependencies]
pyo3 = { version = "0.24", features = ["extension-module"] }
pa-cli = { path = "../../prime-agent/crates/pa-cli" }
pa-models = { path = "../../prime-agent/crates/pa-models" }
pa-core = { path = "../../prime-agent/crates/pa-core" }
pa-types = { path = "../../prime-agent/crates/pa-types" }
pa-ai = { path = "../../prime-agent/crates/pa-ai" }
pa-agent = { path = "../../prime-agent/crates/pa-agent" }
pa-daemon = { path = "../../prime-agent/crates/pa-daemon" }
pa-tui = { path = "../../prime-agent/crates/pa-tui" }
pa-telemetry = { path = "../../prime-agent/crates/pa-telemetry" }
serde = "1"
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros", "net"] }
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }
